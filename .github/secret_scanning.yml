# Secret Scanning 排除配置
#
# 为什么要排除 docs/：
# 本目录是纯文档，会出现「看起来像密钥、但其实是示例占位符」的内容
# （例如微信小程序 AppID 格式的说明、mcp-config 的环境变量示例）。
# GitHub Secret Scanning 是正则匹配，不判断语义，
# 因此会把这类文档示例误报成真密钥并反复发邮件提醒。
#
# 这里排除的都是文档，不含任何真实凭据；
# 真实凭据（GitHub PAT / 麦当劳 MCP Token）一律只存在于本地 .env.local，
# 已被 .gitignore 忽略，且推送脚本会显式跳过。
#
# 官方文档：
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
paths-ignore:
  - "docs/**"
  - "*.md"
  - "*.txt"
